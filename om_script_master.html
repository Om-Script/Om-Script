<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ॐ-Script v1.0 | Praṇava & Varṇagul Engine</title>
<style>
  :root {
    --bg: #05070a; --panel: #0d111a; --border: #1e2638;
    --gold: #e6c17a; --gold-dim: rgba(230, 193, 122, 0.15);
    --cyan: #67d4e4; --rose: #e87a90; --text: #e8ecf4; --muted: #6b7a99; --green: #6be09b;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; padding: 24px; line-height: 1.5; }
  .container { max-width: 1400px; margin: 0 auto; }
  
  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
  .title-group h1 { margin: 0; font-size: 1.8rem; color: var(--gold); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .title-group p { margin: 4px 0 0 0; color: var(--muted); font-size: 0.95rem; }
  
  .presets { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  button.preset-btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-size: 0.82rem; cursor: pointer; transition: 0.15s; }
  button.preset-btn:hover { border-color: var(--gold); color: var(--gold); }

  .input-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 24px; }
  .input-header { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  textarea#iastInput { width: 100%; height: 68px; background: #030407; border: 1px solid var(--border); color: #fff; padding: 12px 14px; font-size: 1.2rem; border-radius: 6px; font-family: monospace; outline: none; resize: vertical; }
  textarea#iastInput:focus { border-color: var(--gold); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; margin-bottom: 24px; }
  .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .panel-title { font-size: 0.95rem; font-weight: 600; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; }
  
  .pranava-stage { background: #030407; border: 1px solid var(--border); border-radius: 8px; padding: 24px; font-size: 2.2rem; color: var(--green); text-align: center; font-family: "Segoe UI Symbol", "Apple Symbols", monospace; letter-spacing: 3px; word-spacing: 12px; }
  .varnagul-stage { background: #030407; border: 1px solid var(--border); border-radius: 8px; padding: 24px; font-size: 2.5rem; text-align: center; word-spacing: 8px; }
  
  .v-root { color: var(--gold); font-weight: 600; }
  .v-func-word, .v-tag { font-size: 75%; color: var(--cyan); }
  .v-breath { font-size: 75%; color: var(--rose); margin: 0 6px; }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-group">
      <h1>ॐ-Script | Architecture Engine</h1>
      <p>Praṇava Physical Vectors • Varṇagul Digital Blocks</p>
    </div>
  </header>

  <div class="presets">
    <button class="preset-btn" onclick="setPreset('ATHA śūra·ḥ jagat·ṃ OM rakṣ·a·ti SVĀHĀ ||')">1. The Hero Protects</button>
    <button class="preset-btn" onclick="setPreset('ATHA dhṛtarāṣṭra·ḥ hūṃ OM vac·a·tava·ti ||')">2. Gītā 1.1</button>
    <button class="preset-btn" onclick="setPreset('ATHA aham gaṇaka·ṃ OM kṛ·a·mi SVĀHĀ ||')">3. Logic Statement</button>
  </div>

  <div class="input-card">
    <div class="input-header">Canonical 1D Input (Machine Code)</div>
    <textarea id="iastInput" spellcheck="false">ATHA śūra·ḥ jagat·ṃ OM rakṣ·a·ti SVĀHĀ ||</textarea>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Layer 1: Praṇava 1D Vectors (Lossless Physics)</span>
      <span style="font-size:0.8rem; color:var(--muted);">Explicit Airflow (→ ↑) • Logic Tags (. : .: :: °)</span>
    </div>
    <div class="pranava-stage" id="pranavaOutput"></div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="panel-title">Layer 2: Varṇagul 3.1 (Human UI Mode)</span>
      <span style="font-size:0.8rem; color:var(--muted);">Immutable Root • Unicode Native</span>
    </div>
    <div class="varnagul-stage" id="varnagulOutput"></div>
  </div>
</div>

<script>
// ============================================================================
// 1. PRANAVA VECTOR COMPILER
// ============================================================================
const PRANAVA_MAP = {
  'k':'□', 'kh':"□'", 'g':'□•', 'gh':"□•'", 'ṅ':'□~',
  'c':'△', 'ch':"△'", 'j':'△•', 'jh':"△•'", 'ñ':'△~',
  'ṭ':'⌒', 'ṭh':"⌒'", 'ḍ':'⌒•', 'ḍh':"⌒•'", 'ṇ':'⌒~',
  't':'|', 'th':"|'", 'd':'|•', 'dh':"|•'", 'n':'|~',
  'p':'○', 'ph':"○'", 'b':'○•', 'bh':"○•'", 'm':'○~',
  'y':'△≈', 'r':'⌒≈', 'l':'|≈', 'v':'○≈',
  'ś':'△/', 'ṣ':'⌒/', 's':'|/', 'h':'□/'
};
const PRANAVA_VOWELS = { 'a':'→', 'ā':'↠', 'i':'↑', 'ī':'⇈', 'u':'↓', 'ū':'⇊', 'e':'↗', 'ai':'⇗', 'o':'↘', 'au':'⇘', 'ṛ':'↺', 'ṝ':'⇋' };

function compileToPranava(rawStr) {
  if (['ATHA','OM','SVĀHĀ','||','॥'].includes(rawStr)) {
    const s = {'ATHA':'◉ ATHA','OM':'◎','SVĀHĀ':'⏹ SVĀHĀ','||':'॥','॥':'॥'};
    return s[rawStr];
  }
  if (rawStr.startsWith('hīṃ') || rawStr.startsWith('hūṃ')) return `₍${rawStr}₎`;

  let out = '';
  const parts = rawStr.replace(/^√/, '').split('·');
  
  parts.forEach((part, i) => {
    if (part === 'ḥ') out += ' . ';
    else if (part === 'ṃ') out += ' : ';
    else if (part === 'sya') out += ' .: ';
    else if (part === 'su') out += ' :: ';
    else if (part === 'a' && i > 0) out += ' ° '; // Buffer
    else {
      let stream = part;
      let j = 0; 
      let consKeys = Object.keys(PRANAVA_MAP).sort((a,b)=>b.length-a.length);
      let vowKeys = Object.keys(PRANAVA_VOWELS).sort((a,b)=>b.length-a.length);
      
      while (j < stream.length) {
        let matched = false;
        // Check Consonants
        for (let k of consKeys) {
          if (stream.startsWith(k, j)) { out += PRANAVA_MAP[k]; j += k.length; matched = true; break; }
        }
        if (!matched) {
          // Check Vowels
          for (let v of vowKeys) {
            if (stream.startsWith(v, j)) { out += PRANAVA_VOWELS[v]; j += v.length; matched = true; break; }
          }
        }
        if (!matched) { out += stream[j]; j++; } // Fallback
      }
    }
  });
  return out.trim();
}

// ============================================================================
// 2. VARNAGUL 3.1 COMPILER (Everyday Native Subset)
// ============================================================================
const VG_SPECS = {
  'k':{b:'ㄱ'}, 'g':{b:'ㄲ'}, 'ṅ':{b:'ㅇ'}, 'c':{b:'ㅈ'}, 'j':{b:'ㅉ'}, 'ñ':{b:'ㄴ'}, 
  'ṭ':{b:'ㄷ'}, 'ḍ':{b:'ㄸ'}, 'ṇ':{b:'ㄴ'}, 't':{b:'ㄷ'}, 'd':{b:'ㄸ'}, 'n':{b:'ㄴ'}, 
  'p':{b:'ㅂ'}, 'b':{b:'ㅃ'}, 'm':{b:'ㅁ'}, 'y':{t:'G'}, 'r':{b:'ㄹ'}, 'l':{b:'ㄹ'}, 
  'v':{b:'ㅂ'}, 'ś':{b:'ㅅ'}, 'ṣ':{b:'ㅅ'}, 's':{b:'ㅅ'}, 'h':{b:'ㅎ'},
  'a':{t:'V', b:'ㅏ'}, 'ā':{t:'V', b:'ㅏ'}, 'i':{t:'V', b:'ㅣ'}, 'ī':{t:'V', b:'ㅐ'}, 
  'u':{t:'V', b:'ㅜ'}, 'ū':{t:'V', b:'ㅠ'}, 'e':{t:'V', b:'ㅔ'}, 'o':{t:'V', b:'ㅗ'}, 
  'ṛ':{t:'EXP', s:['r','i']}, 'kh':{b:'ㄱ'}, 'gh':{b:'ㄲ'}, 'ch':{b:'ㅈ'}, 'jh':{b:'ㅉ'}, 
  'ṭh':{b:'ㄷ'}, 'ḍh':{b:'ㄸ'}, 'th':{b:'ㄷ'}, 'dh':{b:'ㄸ'}, 'ph':{b:'ㅂ'}, 'bh':{b:'ㅃ'}
};

const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const JUNGSUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ᅫ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
const JONGSUNG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

function makeHangul(c, v, j='', m='') {
  let cI = CHOSUNG.indexOf(c); let vI = JUNGSUNG.indexOf(v); let jI = JONGSUNG.indexOf(j);
  if(cI===-1)cI=11; if(vI===-1)vI=18; if(jI===-1)jI=0;
  return String.fromCharCode(0xAC00 + (cI*21+vI)*28+jI) + m;
}

function compileToVarnagul(part, isRoot) {
  let str = part.toLowerCase();
  if(str==='vac') return makeHangul('ㅇ','ㅘ','ㄱ');
  if(str==='tava') return makeHangul('ㅌ','ㅏ','') + makeHangul('ㅇ','ㅘ','');
  
  let stream = [], i=0;
  let keys = Object.keys(VG_SPECS).sort((a,b) => b.length-a.length);
  while(i<str.length) {
    let matched=false;
    for(let k of keys) {
      if(str.startsWith(k, i)) {
        if(VG_SPECS[k].t==='EXP') VG_SPECS[k].s.forEach(x => stream.push({b:VG_SPECS[x].b, t:'C'}));
        else stream.push({b:VG_SPECS[k].b, m:VG_SPECS[k].m||'', t:VG_SPECS[k].t||'C'});
        i+=k.length; matched=true; break;
      }
    }
    if(!matched) i++;
  }
  
  if(isRoot && stream.length && stream[stream.length-1].t==='C' && stream[stream.length-1].b==='ㅈ') stream[stream.length-1].b='ㄱ';

  let syls=[], idx=0;
  while(idx<stream.length) {
    let cur = stream[idx];
    if(cur.t==='C') {
      let v=null, j='';
      if(idx+1<stream.length && stream[idx+1].t==='V') { v=stream[idx+1].b; idx++; }
      if(!v) { syls.push({c:cur.b, v:'ㅡ', j:'', m:cur.m}); idx++; continue; }
      if(idx+1<stream.length && stream[idx+1].t==='C') {
        let nxt = stream[idx+1];
        if(idx+1===stream.length-1 || (idx+2<stream.length && stream[idx+2].t==='C' && ['ㅁ','ㄴ','ㄹ','ㅇ'].includes(nxt.b))) {
          if(JONGSUNG.includes(nxt.b) && !nxt.m) { j=nxt.b; idx++; }
        }
      }
      syls.push({c:cur.b, v, j, m:cur.m}); idx++;
    } else if (cur.t==='V') { syls.push({c:'ㅇ', v:cur.b, j:'', m:''}); idx++; }
    else idx++;
  }
  return syls.map(s => makeHangul(s.c, s.v, s.j, s.m)).join('');
}

// ============================================================================
// 3. MASTER COORDINATOR
// ============================================================================
const FUNCTION_WORDS = new Set(['aham', 'tvam', 'saḥ', 'tat', 'idam', 'ca', 'vā', 'na', 'yadi', 'tarhi', 'asti', 'santi', 'hīṃ', 'hūṃ']);

function compileAll() {
  const input = document.getElementById('iastInput').value.replace(/\./g, '·').split(/\s+/).filter(Boolean);
  let out1D = '', vHTML = '';
  
  for (const tok of input) {
    out1D += compileToPranava(tok) + ' ';

    if (['ATHA', 'OM', 'SVĀHĀ', '||', '॥'].includes(tok)) {
      const sigils = {'ATHA':'〔아타〕','OM':'ॐ','SVĀHĀ':'〔솨하〕','||':'॥','॥':'॥'};
      vHTML += `<span class="v-breath">${sigils[tok]}</span> `; continue;
    }
    if (tok.startsWith('hīṃ') || tok.startsWith('hūṃ')) { vHTML += `<span class="v-breath">₍${tok}₎</span> `; continue; }

    const cleanTok = tok.replace(/^√/, ''); 
    const parts = cleanTok.split('·').filter(Boolean);
    const isFunc = parts.length === 1 && FUNCTION_WORDS.has(parts[0].toLowerCase());
    
    let wordVHTML = '';
    parts.forEach((part, idx) => {
      if (part === 'ḥ') wordVHTML += `<span class="v-tag">ः</span>`;
      else if (part === 'ṃ') { if (idx > 0 && wordVHTML.length) wordVHTML += `<span class="v-tag">°</span>`; } 
      else {
        const blockStr = compileToVarnagul(part, part === parts[0] && !isFunc);
        wordVHTML += `<span class="${isFunc ? 'v-func-word' : (idx === 0 ? 'v-root' : 'v-tag')}">${blockStr}</span>`;
      }
    });
    vHTML += `<span style="display:inline-block; margin: 0 4px;">${wordVHTML}</span> `;
  }

  document.getElementById('pranavaOutput').textContent = out1D.trim();
  document.getElementById('varnagulOutput').innerHTML = vHTML;
}

function setPreset(txt) { document.getElementById('iastInput').value = txt; compileAll(); }
document.getElementById('iastInput').addEventListener('input', compileAll);
compileAll();
</script>
</body>
</html>
